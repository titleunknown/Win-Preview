name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the app
        run: dotnet build src/WinPreview.App -c Release -p:Platform=x64 --nologo

      - name: Test
        run: dotnet test tests/WinPreview.Core.Tests -c Release --nologo
